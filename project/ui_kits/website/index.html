<style>
  /* Kit-local: DM Sans carries no Devanagari, so the bilingual lines get a companion
     face. Everything else stays on the design system's single family. */
  body {
    background: var(--surface-page-canvas);
    --font-hi: "Noto Sans Devanagari", "DM Sans", sans-serif;
  }
  @media (max-width: 900px) {
    body { --page-gutter: 24px; --section-padding-y: 48px; }
  }
  /* Display type tuned for a desk becomes a wall of letters on a phone: 48px headings
     were eating whole screens. Retuned at the token, so every section follows and
     nothing above 768px moves. */
  @media (max-width: 767px) {
    body {
      --text-display: clamp(32px, 9vw, 42px);
      --text-heading-lg: clamp(30px, 8vw, 36px);
      --text-heading: clamp(26px, 7vw, 32px);
      --section-padding-y: 52px;
      --spacing-64: 40px;
      --spacing-48: 32px;
    }
  }
  @media (max-width: 380px) {
    body { --page-gutter: 16px; --card-padding: 20px; --card-padding-lg: 20px; }
  }
  /* Flex and grid children default to min-width:auto — "never smaller than my
     content" — which is what pushes a page sideways on a 320px screen. */
  *, *::before, *::after { min-width: 0; }
  img, video, svg, canvas { max-width: 100%; height: auto; }
  /* The conversion bar is the mobile answer to "the phone number must always be one
     tap away". From 1024px the header carries its own Book appointment CTA and the
     full address sits in the footer, so the bar is redundant chrome. */
  @media (min-width: 1024px) {
    [data-sticky-bar] { display: none; }
    body { --sticky-bar-clearance: 0px; }
  }
  /* Mobile carousel strips: hide the scrollbar chrome without disabling scrolling.
     The snap behaviour itself is set inline alongside the rest of the layout. */
  .ds-strip { scrollbar-width: none; -ms-overflow-style: none; }
  .ds-strip::-webkit-scrollbar { display: none; }
  .ds-strip:focus-visible { outline: 2px solid var(--color-leaf-bright); outline-offset: 2px; }
  @media (prefers-reduced-motion: no-preference) {
    .ds-strip { scroll-behavior: smooth; }
  }
  /* The FAQ uses <details>; suppress the native marker in favour of the +/x glyph. */
  summary::-webkit-details-marker { display: none; }
  summary::marker { content: ""; }
  details[open] > summary > span[aria-hidden] { transform: rotate(45deg); }
  summary > span[aria-hidden] { transition: transform 160ms cubic-bezier(.2,0,.2,1); }
  @media (prefers-reduced-motion: reduce) {
    summary > span[aria-hidden] { transition: none; }
  }
</style>
