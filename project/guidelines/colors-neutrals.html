<!-- @dsCard group="Colors" viewport="700x150" subtitle="Ink black for dividers and icon strokes; white for card surfaces" name="Neutral ramp" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Neutral ramp</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--color-paper-white); margin: 0; padding: 20px 24px; width: 700px; height: 150px; overflow: hidden; }
  .row { display: flex; gap: 12px; align-items: flex-start; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 56px; border-radius: var(--radius-icons); }
  .nm { font-size: 11px; font-weight: 600; color: var(--color-charcoal); letter-spacing: 0; }
  .hx { font-size: 11px; color: var(--color-slate); font-variant-numeric: tabular-nums; }
  .lbl { font-size: 11px; font-weight: 600; color: var(--color-slate); text-transform: uppercase; letter-spacing: .06em; }
</style>
</head>
<body>
<div class="row"><div class="sw" style="width:76px"><div class="chip" style="background:#000000;"></div><div class="nm">Ink Black</div><div class="hx">#000000</div></div><div class="sw" style="width:76px"><div class="chip" style="background:#333333;"></div><div class="nm">Charcoal</div><div class="hx">#333333</div></div><div class="sw" style="width:76px"><div class="chip" style="background:#3d3d3d;"></div><div class="nm">Graphite</div><div class="hx">#3d3d3d</div></div><div class="sw" style="width:76px"><div class="chip" style="background:#7a7a7a;"></div><div class="nm">Slate</div><div class="hx">#7a7a7a</div></div><div class="sw" style="width:76px"><div class="chip" style="background:#a6a6a6;"></div><div class="nm">Ash</div><div class="hx">#a6a6a6</div></div><div class="sw" style="width:76px"><div class="chip" style="background:#e0e0e0;"></div><div class="nm">Frost Gray</div><div class="hx">#e0e0e0</div></div><div class="sw" style="width:76px"><div class="chip" style="background:#f2f2f2;"></div><div class="nm">Cloud Gray</div><div class="hx">#f2f2f2</div></div><div class="sw" style="width:76px"><div class="chip" style="background:#ffffff;border:1px solid var(--color-frost-gray)"></div><div class="nm">Paper White</div><div class="hx">#ffffff</div></div></div>
</body>
</html>
