<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Elevation: flat</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--color-paper-white); margin: 0; padding: 20px 24px; width: 700px; height: 180px; overflow: hidden; }
  .row { display: flex; gap: 12px; align-items: flex-start; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 56px; border-radius: var(--radius-icons); }
  .nm { font-size: 11px; font-weight: 600; color: var(--color-charcoal); letter-spacing: 0; }
  .hx { font-size: 11px; color: var(--color-slate); font-variant-numeric: tabular-nums; }
  .lbl { font-size: 11px; font-weight: 600; color: var(--color-slate); text-transform: uppercase; letter-spacing: .06em; }
</style>
</head>
<body>
<div class="row" style="gap:16px;align-items:stretch"><div style="flex:1;background:#d2f2e3;border-radius:24px;padding:20px;font-size:14px;font-weight:500;color:#0a3922">Correct — flat pastel card, no shadow<div style="height:34px"></div><span class="hx">box-shadow: none</span></div><div style="flex:1;background:#fff;border:1px solid #e0e0e0;border-radius:16px;padding:20px;font-size:14px;font-weight:500;color:#333">Form field only<div style="height:8px"></div><input placeholder="+27 82 000 0000" style="width:100%;padding:10px 14px;border:1px solid #e0e0e0;border-radius:8px;box-shadow:rgba(0,0,0,.05) 0 1px 1px 0;font-size:14px"><div style="height:6px"></div><span class="hx">--shadow-subtle</span></div></div>
</body>
</html>
