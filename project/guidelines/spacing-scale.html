<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spacing scale</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--color-paper-white); margin: 0; padding: 20px 24px; width: 700px; height: 170px; overflow: hidden; }
  .row { display: flex; gap: 12px; align-items: flex-start; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 56px; border-radius: var(--radius-icons); }
  .nm { font-size: 11px; font-weight: 600; color: var(--color-charcoal); letter-spacing: 0; }
  .hx { font-size: 11px; color: var(--color-slate); font-variant-numeric: tabular-nums; }
  .lbl { font-size: 11px; font-weight: 600; color: var(--color-slate); text-transform: uppercase; letter-spacing: .06em; }
</style>
</head>
<body>
<div style="display:flex;gap:10px;align-items:flex-end"><div class="sw" style="width:26px"><div style="height:18px;background:#d2f2e3;border-radius:4px;width:8px"></div><div class="hx">4</div></div><div class="sw" style="width:26px"><div style="height:22px;background:#d2f2e3;border-radius:4px;width:8px"></div><div class="hx">8</div></div><div class="sw" style="width:26px"><div style="height:26px;background:#d2f2e3;border-radius:4px;width:12px"></div><div class="hx">12</div></div><div class="sw" style="width:26px"><div style="height:30px;background:#d2f2e3;border-radius:4px;width:16px"></div><div class="hx">16</div></div><div class="sw" style="width:26px"><div style="height:34px;background:#d2f2e3;border-radius:4px;width:20px"></div><div class="hx">20</div></div><div class="sw" style="width:26px"><div style="height:38px;background:#d2f2e3;border-radius:4px;width:24px"></div><div class="hx">24</div></div><div class="sw" style="width:32px"><div style="height:46px;background:#d2f2e3;border-radius:4px;width:32px"></div><div class="hx">32</div></div><div class="sw" style="width:40px"><div style="height:54px;background:#d2f2e3;border-radius:4px;width:40px"></div><div class="hx">40</div></div><div class="sw" style="width:48px"><div style="height:62px;background:#d2f2e3;border-radius:4px;width:48px"></div><div class="hx">48</div></div><div class="sw" style="width:56px"><div style="height:70px;background:#d2f2e3;border-radius:4px;width:56px"></div><div class="hx">56</div></div><div class="sw" style="width:64px"><div style="height:78px;background:#d2f2e3;border-radius:4px;width:64px"></div><div class="hx">64</div></div><div class="sw" style="width:80px"><div style="height:94px;background:#d2f2e3;border-radius:4px;width:80px"></div><div class="hx">80</div></div><div class="sw" style="width:120px"><div style="height:96px;background:#d2f2e3;border-radius:4px;width:120px"></div><div class="hx">120</div></div></div>

</html>
