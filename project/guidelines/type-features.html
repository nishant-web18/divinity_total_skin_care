<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ss03 stylistic set</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--color-paper-white); margin: 0; padding: 20px 24px; width: 700px; height: 170px; overflow: hidden; }
  .row { display: flex; gap: 12px; align-items: flex-start; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 56px; border-radius: var(--radius-icons); }
  .nm { font-size: 11px; font-weight: 600; color: var(--color-charcoal); letter-spacing: 0; }
  .hx { font-size: 11px; color: var(--color-slate); font-variant-numeric: tabular-nums; }
  .lbl { font-size: 11px; font-weight: 600; color: var(--color-slate); text-transform: uppercase; letter-spacing: .06em; }
</style>
</head>
<body>
<div class="row" style="gap:32px;align-items:flex-end"><div class="sw"><div style="font-size:44px;font-weight:500;letter-spacing:-0.019em;color:#0a3922;font-feature-settings:'ss03'">agjy 1234</div><div class="nm">ss03 on</div></div><div class="sw"><div style="font-size:44px;font-weight:500;letter-spacing:-0.019em;color:#a6a6a6;font-feature-settings:normal">agjy 1234</div><div class="nm">default (don't)</div></div></div>
</body>
</html>
