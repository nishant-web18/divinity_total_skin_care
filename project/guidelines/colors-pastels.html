<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pastel washes</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--color-paper-white); margin: 0; padding: 20px 24px; width: 700px; height: 150px; overflow: hidden; }
  .row { display: flex; gap: 12px; align-items: flex-start; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 56px; border-radius: var(--radius-icons); }
  .nm { font-size: 11px; font-weight: 600; color: var(--color-charcoal); letter-spacing: 0; }
  .hx { font-size: 11px; color: var(--color-slate); font-variant-numeric: tabular-nums; }
  .lbl { font-size: 11px; font-weight: 600; color: var(--color-slate); text-transform: uppercase; letter-spacing: .06em; }
</style>
</head>
<body>
<div class="row"><div class="sw" style="width:76px"><div class="chip" style="background:#eee2ff;"></div><div class="nm">Lavender Mist</div><div class="hx">#eee2ff</div></div><div class="sw" style="width:76px"><div class="chip" style="background:#d2f2e3;"></div><div class="nm">Mint Wash</div><div class="hx">#d2f2e3</div></div><div class="sw" style="width:76px"><div class="chip" style="background:#ccf0f8;"></div><div class="nm">Sky Wash</div><div class="hx">#ccf0f8</div></div><div class="sw" style="width:76px"><div class="chip" style="background:#e4f7ee;"></div><div class="nm">Sage Wash</div><div class="hx">#e4f7ee</div></div><div class="sw" style="width:76px"><div class="chip" style="background:#fdf0ff;"></div><div class="nm">Lilac Wash</div><div class="hx">#fdf0ff</div></div><div class="sw" style="width:76px"><div class="chip" style="background:#ffede8;"></div><div class="nm">Peach Wash</div><div class="hx">#ffede8</div></div><div class="sw" style="width:76px"><div class="chip" style="background:#faf7e8;"></div><div class="nm">Cream</div><div class="hx">#faf7e8</div></div><div class="sw" style="width:76px"><div class="chip" style="background:#f4ece9;"></div><div class="nm">Sand</div><div class="hx">#f4ece9</div></div></div>
</body>
</html>
