<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brand anchors</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--color-paper-white); margin: 0; padding: 20px 24px; width: 700px; height: 150px; overflow: hidden; }
  .row { display: flex; gap: 12px; align-items: flex-start; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 56px; border-radius: var(--radius-icons); }
  .nm { font-size: 11px; font-weight: 600; color: var(--color-charcoal); letter-spacing: 0; }
  .hx { font-size: 11px; color: var(--color-slate); font-variant-numeric: tabular-nums; }
  .lbl { font-size: 11px; font-weight: 600; color: var(--color-slate); text-transform: uppercase; letter-spacing: .06em; }
</style>
</head>
<body>
<div class="row"><div class="sw" style="width:122px"><div class="chip" style="background:#0a3922;"></div><div class="nm">Canopy Green</div><div class="hx">#0a3922</div></div><div class="sw" style="width:122px"><div class="chip" style="background:#ff643b;"></div><div class="nm">Coral Pulse</div><div class="hx">#ff643b</div></div><div class="sw" style="width:122px"><div class="chip" style="background:#460095;"></div><div class="nm">Indigo Bloom</div><div class="hx">#460095</div></div><div class="sw" style="width:122px"><div class="chip" style="background:#1dbf73;"></div><div class="nm">Leaf Bright</div><div class="hx">#1dbf73</div></div><div class="sw" style="width:122px"><div class="chip" style="background:#003642;"></div><div class="nm">Deep Teal</div><div class="hx">#003642</div></div></div>
</body>
</html>
