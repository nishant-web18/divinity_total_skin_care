<!-- @dsCard group="Colors" viewport="700x190" subtitle="Coral Pulse is the only vivid warm — filled CTAs only, always twinned with a ghost" name="Action colour" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Action colour</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--color-paper-white); margin: 0; padding: 20px 24px; width: 700px; height: 190px; overflow: hidden; }
  .row { display: flex; gap: 12px; align-items: flex-start; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 56px; border-radius: var(--radius-icons); }
  .nm { font-size: 11px; font-weight: 600; color: var(--color-charcoal); letter-spacing: 0; }
  .hx { font-size: 11px; color: var(--color-slate); font-variant-numeric: tabular-nums; }
  .lbl { font-size: 11px; font-weight: 600; color: var(--color-slate); text-transform: uppercase; letter-spacing: .06em; }
  .btn { border:0; cursor:pointer; font-size:16px; font-weight:600; padding:12px 24px; border-radius:var(--radius-buttons); }
  .panel { border-radius: var(--radius-cards); padding:20px 24px; display:flex; gap:12px; align-items:center; }
</style>
</head>
<body>
<div style="display:flex; flex-direction:column; gap:12px"><div class="panel" style="background:#0a3922"><button class="btn" style="background:#ff643b;color:#fff">Book a Call</button><button class="btn" style="background:transparent;color:#fff;border:1px solid #fff;font-weight:500">Take a tour</button><span style="margin-left:auto;font-size:12px;color:#d2f2e3">on dark hero</span></div><div class="panel" style="background:#eee2ff"><button class="btn" style="background:#ff643b;color:#fff">Book a Call</button><button class="btn" style="background:transparent;color:#000;border:1px solid #000;font-weight:500">Take a tour</button><span style="margin-left:auto;font-size:12px;color:#47264c">on lavender canvas</span></div></div>
</body>
</html>
