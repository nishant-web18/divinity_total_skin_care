<!-- @dsCard group="Spacing" viewport="700x180" subtitle="tags 9999 · buttons 40 · cards 24 · product cards 16 · icons 8 — never 0–2px" name="Named radii" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Named radii</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--color-paper-white); margin: 0; padding: 20px 24px; width: 700px; height: 180px; overflow: hidden; }
  .row { display: flex; gap: 12px; align-items: flex-start; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 56px; border-radius: var(--radius-icons); }
  .nm { font-size: 11px; font-weight: 600; color: var(--color-charcoal); letter-spacing: 0; }
  .hx { font-size: 11px; color: var(--color-slate); font-variant-numeric: tabular-nums; }
  .lbl { font-size: 11px; font-weight: 600; color: var(--color-slate); text-transform: uppercase; letter-spacing: .06em; }
</style>
</head>
<body>
<div class="row" style="gap:16px"><div class="sw"><div style="width:88px;height:64px;background:#eee2ff;border:1px solid #460095;border-radius:9999px"></div><div class="nm">tags</div><div class="hx">9999px</div></div><div class="sw"><div style="width:108px;height:64px;background:#eee2ff;border:1px solid #460095;border-radius:40px"></div><div class="nm">buttons</div><div class="hx">40px</div></div><div class="sw"><div style="width:108px;height:64px;background:#eee2ff;border:1px solid #460095;border-radius:24px"></div><div class="nm">cards</div><div class="hx">24px</div></div><div class="sw"><div style="width:108px;height:64px;background:#eee2ff;border:1px solid #460095;border-radius:16px"></div><div class="nm">cards-sm</div><div class="hx">16px</div></div><div class="sw"><div style="width:72px;height:64px;background:#eee2ff;border:1px solid #460095;border-radius:8px"></div><div class="nm">icons</div><div class="hx">8px</div></div></div>
</body>
</html>
