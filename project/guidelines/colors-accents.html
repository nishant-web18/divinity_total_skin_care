<!-- @dsCard group="Colors" viewport="700x150" subtitle="Decorative only — icons, chart lines, badges. Never a CTA." name="Accents" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Accents</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--color-paper-white); margin: 0; padding: 20px 24px; width: 700px; height: 150px; overflow: hidden; }
  .row { display: flex; gap: 12px; align-items: flex-start; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 56px; border-radius: var(--radius-icons); }
  .nm { font-size: 11px; font-weight: 600; color: var(--color-charcoal); letter-spacing: 0; }
  .hx { font-size: 11px; color: var(--color-slate); font-variant-numeric: tabular-nums; }
  .lbl { font-size: 11px; font-weight: 600; color: var(--color-slate); text-transform: uppercase; letter-spacing: .06em; }
</style>
</head>
<body>
<div class="row"><div class="sw" style="width:122px"><div class="chip" style="background:#f3b3fe;"></div><div class="nm">Orchid Tint</div><div class="hx">#f3b3fe</div></div><div class="sw" style="width:122px"><div class="chip" style="background:#00b4dc;"></div><div class="nm">Sky Signal</div><div class="hx">#00b4dc</div></div><div class="sw" style="width:122px"><div class="chip" style="background:#47264c;"></div><div class="nm">Aubergine</div><div class="hx">#47264c</div></div></div>
</body>
</html>
