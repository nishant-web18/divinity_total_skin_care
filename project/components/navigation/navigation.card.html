<!-- @dsCard group="Components" viewport="700x200" name="Navigation" subtitle="White sticky top bar over the green hero band" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Navigation</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
<script src="../../assets/ds-dev-loader.js"></script>
<style>
  body { background: var(--color-canopy-green); margin:0; padding:20px 24px; width:700px; height:200px; overflow:hidden; }
  .lbl { font-size:11px; font-weight:600; color:var(--color-slate); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px }
  .grp { display:flex; gap:12px; align-items:center; flex-wrap:wrap }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
function renderCard() {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(
    <div style={{ margin: '-20px -24px' }}>
      <TopNav active="Product" style={{ '--page-gutter': '24px' }} />
      <div style={{ padding: '20px 24px', color: 'var(--color-mint-wash)', fontSize: 14 }}>
        Sits flush on the dark band — no shadow, no divider.
      </div>
    </div>
  );
}
dsLoad(["../navigation/TopNav.jsx"]).then(function (m) {
  Object.assign(window, m);
  renderCard();
}).catch(function (err) {
  document.getElementById("root").textContent = String(err);
  console.error(err);
});
</script>
</body>
</html>
