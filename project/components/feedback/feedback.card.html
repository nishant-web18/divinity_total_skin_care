<!-- @dsCard group="Components" viewport="700x210" name="Feedback" subtitle="Sticky deadline card with countdown blocks, cream CTA and dismiss" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feedback</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
<script src="../../assets/ds-dev-loader.js"></script>
<style>
  body { background: var(--color-paper-white); margin:0; padding:20px 24px; width:700px; height:210px; overflow:hidden; }
  .lbl { font-size:11px; font-weight:600; color:var(--color-slate); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px }
  .grp { display:flex; gap:12px; align-items:center; flex-wrap:wrap }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
function renderCard() {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      <NotificationCard title="Health Accelerator 2026" subtitle="Application deadline 31 May" countdown={['24d','5h','1m','45s']} ctaLabel="Apply now" onClose={() => {}} />
      <NotificationCard title="Two seats left on the April cohort" subtitle="Cape Town + remote" ctaLabel="Join" />
    </div>
  );
}
dsLoad(["../feedback/NotificationCard.jsx"]).then(function (m) {
  Object.assign(window, m);
  renderCard();
}).catch(function (err) {
  document.getElementById("root").textContent = String(err);
  console.error(err);
});
</script>
</body>
</html>
