<!-- @dsCard group="Components" viewport="700x400" name="Product mockups" subtitle="Chat phone mockup with incoming/outgoing bubbles and composer" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Product mockups</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
<script src="../../assets/ds-dev-loader.js"></script>
<style>
  body { background: var(--color-mint-wash); margin:0; padding:20px 24px; width:700px; height:400px; overflow:hidden; }
  .lbl { font-size:11px; font-weight:600; color:var(--color-slate); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px }
  .grp { display:flex; gap:12px; align-items:center; flex-wrap:wrap }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
function renderCard() {
  const msgs = [
    { direction: 'in', sender: 'Sister Naledi', text: 'Hi Thandi — your check-up is Tuesday 10:30.', time: '09:41' },
    { direction: 'out', text: 'Confirmed, thank you.', time: '09:42' },
    { direction: 'in', text: 'Reply 2 if you need to move it.', time: '09:42' },
  ];
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(
    <div style={{ display: 'flex', gap: 28, alignItems: 'flex-start' }}>
      <PhoneMockup contact="Khayelitsha Clinic" status="online" messages={msgs} width={300} />
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8, flex: 1, background: 'var(--color-paper-white)', borderRadius: 16, padding: 16 }}>
        <div className="lbl">Bubbles in isolation</div>
        <ChatBubble direction="in" sender="Sister Naledi">Incoming — white, 1px hairline</ChatBubble>
        <ChatBubble direction="out" time="09:42">Outgoing — #dcf8c6</ChatBubble>
      </div>
    </div>
  );
}
dsLoad(["../product/PhoneMockup.jsx", "../product/ChatBubble.jsx"]).then(function (m) {
  Object.assign(window, m);
  renderCard();
}).catch(function (err) {
  document.getElementById("root").textContent = String(err);
  console.error(err);
});
</script>
</body>
</html>
